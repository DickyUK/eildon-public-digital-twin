name: Publish anonymised rolling import peaks
on:
  schedule:
    - cron: '21 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate anonymous import peaks
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_ELECTRICITY_MPAN: ${{ secrets.OCTOPUS_ELECTRICITY_MPAN }}
          OCTOPUS_ELECTRICITY_SERIAL: ${{ secrets.OCTOPUS_ELECTRICITY_SERIAL }}
        run: python scripts/publish_peaks.py
      - name: Commit verified public aggregate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified-peaks.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified anonymised rolling energy peaks"
            git push
          fi
